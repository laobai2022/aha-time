<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aha - 应用构建器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'SF Pro Display', system-ui, -apple-system, sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .neon-glow {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        
        .device-frame {
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 45px;
            padding: 8px;
            margin: 0 auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        
        .device-screen {
            width: 100%;
            height: 100%;
            border-radius: 37px;
            overflow: hidden;
            position: relative;
        }
        
        .status-bar {
            height: 44px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
        }
        
        .home-indicator {
            width: 134px;
            height: 5px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 3px;
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .component-item {
            transition: all 0.3s ease;
            cursor: grab;
        }
        
        .component-item:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 255, 255, 0.2);
        }
        
        .component-item:active {
            cursor: grabbing;
        }
        
        .drop-zone {
            border: 2px dashed rgba(0, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        .drop-zone.active {
            border-color: rgba(0, 255, 255, 0.8);
            background: rgba(0, 255, 255, 0.1);
        }
        
        .preview-container {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        
        .progress-step {
            transition: all 0.3s ease;
        }
        
        .progress-step.active {
            background: linear-gradient(90deg, #06b6d4, #8b5cf6);
        }
        
        .progress-step.completed {
            background: linear-gradient(90deg, #10b981, #06b6d4);
        }
    </style>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-4">
    <!-- Device Frame -->
    <div class="device-frame">
        <div class="device-screen gradient-bg relative overflow-hidden">
            <!-- Status Bar -->
            <div class="status-bar">
                <div class="flex items-center">
                    <i class="fas fa-arrow-left text-white text-lg mr-3 cursor-pointer"></i>
                    <div class="text-white text-sm font-medium">9:41</div>
                </div>
                <div class="flex items-center space-x-1">
                    <i class="fas fa-signal text-white text-xs"></i>
                    <i class="fas fa-wifi text-white text-xs"></i>
                    <div class="w-6 h-3 border border-white rounded-sm">
                        <div class="w-4 h-1.5 bg-white rounded-sm m-0.5"></div>
                    </div>
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="flex flex-col h-full pt-16 pb-8">
                <!-- Header -->
                <div class="px-4 mb-4">
                    <h1 class="text-xl font-bold text-white mb-1">
                        <i class="fas fa-tools text-cyan-400 mr-2"></i>
                        应用构建器
                    </h1>
                    <p class="text-gray-400 text-sm">营养计算助手</p>
                </div>
                
                <!-- Progress Bar -->
                <div class="px-4 mb-4">
                    <div class="flex items-center space-x-2">
                        <div class="progress-step completed w-6 h-6 rounded-full flex items-center justify-center text-white text-xs">
                            <i class="fas fa-check"></i>
                        </div>
                        <div class="flex-1 h-1 bg-gray-700 rounded">
                            <div class="h-full w-3/4 bg-gradient-to-r from-cyan-500 to-purple-600 rounded"></div>
                        </div>
                        <div class="progress-step active w-6 h-6 rounded-full flex items-center justify-center text-white text-xs font-bold">2</div>
                        <div class="flex-1 h-1 bg-gray-700 rounded"></div>
                        <div class="progress-step w-6 h-6 rounded-full bg-gray-700 flex items-center justify-center text-white text-xs">3</div>
                    </div>
                    <div class="flex justify-between text-xs text-gray-400 mt-1">
                        <span>灵感</span>
                        <span>构建</span>
                        <span>发布</span>
                    </div>
                </div>
                
                <!-- Tabs -->
                <div class="px-4 mb-4">
                    <div class="glass-effect rounded-xl p-1">
                        <div class="grid grid-cols-3 gap-1">
                            <button id="designTab" class="tab-btn py-2 px-3 rounded-lg text-sm font-medium text-white bg-white/10 transition-all">
                                <i class="fas fa-palette mr-1"></i>设计
                            </button>
                            <button id="previewTab" class="tab-btn py-2 px-3 rounded-lg text-sm font-medium text-gray-400 transition-all">
                                <i class="fas fa-mobile-alt mr-1"></i>预览
                            </button>
                            <button id="settingsTab" class="tab-btn py-2 px-3 rounded-lg text-sm font-medium text-gray-400 transition-all">
                                <i class="fas fa-cog mr-1"></i>设置
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Content Area -->
                <div class="flex-1 overflow-hidden">
                    <!-- Design Tab Content -->
                    <div id="designContent" class="h-full px-4">
                        <!-- Component Library -->
                        <div class="mb-4">
                            <h3 class="text-white font-medium mb-3 text-sm">组件库</h3>
                            <div class="grid grid-cols-2 gap-2">
                                <div class="component-item glass-effect rounded-xl p-3 text-center">
                                    <i class="fas fa-text-height text-cyan-400 text-lg mb-1"></i>
                                    <div class="text-white text-xs">标题</div>
                                </div>
                                <div class="component-item glass-effect rounded-xl p-3 text-center">
                                    <i class="fas fa-edit text-green-400 text-lg mb-1"></i>
                                    <div class="text-white text-xs">输入框</div>
                                </div>
                                <div class="component-item glass-effect rounded-xl p-3 text-center">
                                    <i class="fas fa-mouse-pointer text-purple-400 text-lg mb-1"></i>
                                    <div class="text-white text-xs">按钮</div>
                                </div>
                                <div class="component-item glass-effect rounded-xl p-3 text-center">
                                    <i class="fas fa-chart-bar text-orange-400 text-lg mb-1"></i>
                                    <div class="text-white text-xs">图表</div>
                                </div>
                                <div class="component-item glass-effect rounded-xl p-3 text-center">
                                    <i class="fas fa-image text-pink-400 text-lg mb-1"></i>
                                    <div class="text-white text-xs">图片</div>
                                </div>
                                <div class="component-item glass-effect rounded-xl p-3 text-center">
                                    <i class="fas fa-list text-blue-400 text-lg mb-1"></i>
                                    <div class="text-white text-xs">列表</div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Canvas Area -->
                        <div class="mb-4">
                            <h3 class="text-white font-medium mb-3 text-sm">画布</h3>
                            <div class="drop-zone glass-effect rounded-xl p-4 min-h-32">
                                <!-- Dropped Components -->
                                <div class="space-y-3">
                                    <div class="bg-gradient-to-r from-cyan-500/20 to-purple-500/20 rounded-lg p-3 border border-cyan-400/30">
                                        <div class="flex items-center justify-between">
                                            <div class="text-cyan-300 font-medium text-sm">宝宝营养计算器</div>
                                            <i class="fas fa-grip-vertical text-gray-400"></i>
                                        </div>
                                    </div>
                                    
                                    <div class="bg-gradient-to-r from-green-500/20 to-blue-500/20 rounded-lg p-3 border border-green-400/30">
                                        <div class="flex items-center justify-between">
                                            <div class="text-green-300 text-sm">宝宝年龄：</div>
                                            <div class="w-16 h-6 bg-white/10 rounded border border-green-400/50"></div>
                                        </div>
                                    </div>
                                    
                                    <div class="bg-gradient-to-r from-purple-500/20 to-pink-500/20 rounded-lg p-3 border border-purple-400/30">
                                        <div class="text-center">
                                            <div class="bg-gradient-to-r from-purple-500 to-pink-500 text-white py-2 px-4 rounded-lg text-sm font-medium">
                                                计算营养需求
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="text-center text-gray-500 text-sm mt-4">
                                    拖拽组件到这里构建您的应用
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Preview Tab Content -->
                    <div id="previewContent" class="h-full px-4 hidden">
                        <div class="preview-container rounded-xl p-4 h-full">
                            <div class="text-center mb-6">
                                <h2 class="text-xl font-bold text-white mb-2">宝宝营养计算器</h2>
                                <p class="text-gray-400 text-sm">科学搭配，健康成长</p>
                            </div>
                            
                            <!-- App Preview -->
                            <div class="space-y-4">
                                <div class="glass-effect rounded-xl p-4">
                                    <label class="text-cyan-300 text-sm font-medium block mb-2">宝宝年龄（月）</label>
                                    <input type="number" placeholder="6" class="w-full bg-white/10 rounded-lg p-3 text-white outline-none border border-cyan-400/30">
                                </div>
                                
                                <div class="glass-effect rounded-xl p-4">
                                    <label class="text-cyan-300 text-sm font-medium block mb-2">体重（kg）</label>
                                    <input type="number" placeholder="8.5" class="w-full bg-white/10 rounded-lg p-3 text-white outline-none border border-cyan-400/30">
                                </div>
                                
                                <button class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-3 rounded-xl font-medium">
                                    <i class="fas fa-calculator mr-2"></i>计算营养需求
                                </button>
                                
                                <!-- Result Preview -->
                                <div class="glass-effect rounded-xl p-4">
                                    <h3 class="text-white font-medium mb-3">营养建议</h3>
                                    <div class="space-y-2 text-sm">
                                        <div class="flex justify-between text-gray-300">
                                            <span>蛋白质</span>
                                            <span class="text-green-400">14g/天</span>
                                        </div>
                                        <div class="flex justify-between text-gray-300">
                                            <span>钙质</span>
                                            <span class="text-blue-400">600mg/天</span>
                                        </div>
                                        <div class="flex justify-between text-gray-300">
                                            <span>铁质</span>
                                            <span class="text-orange-400">11mg/天</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Settings Tab Content -->
                    <div id="settingsContent" class="h-full px-4 hidden">
                        <div class="space-y-4">
                            <!-- Monetization Settings -->
                            <div class="glass-effect rounded-xl p-4">
                                <h3 class="text-white font-medium mb-3">变现设置</h3>
                                <div class="space-y-3">
                                    <div class="flex items-center justify-between">
                                        <span class="text-gray-300 text-sm">收费模式</span>
                                        <select class="bg-white/10 rounded-lg px-3 py-1 text-white text-sm outline-none">
                                            <option>按次付费</option>
                                            <option>订阅制</option>
                                            <option>免费+广告</option>
                                        </select>
                                    </div>
                                    <div class="flex items-center justify-between">
                                        <span class="text-gray-300 text-sm">单次费用</span>
                                        <div class="flex items-center">
                                            <span class="text-gray-400 mr-1">¥</span>
                                            <input type="number" value="0.5" class="w-16 bg-white/10 rounded px-2 py-1 text-white text-sm outline-none">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Publishing Settings -->
                            <div class="glass-effect rounded-xl p-4">
                                <h3 class="text-white font-medium mb-3">发布设置</h3>
                                <div class="space-y-3">
                                    <div class="flex items-center justify-between">
                                        <span class="text-gray-300 text-sm">应用名称</span>
                                        <input type="text" value="宝宝营养计算器" class="bg-white/10 rounded px-3 py-1 text-white text-sm outline-none">
                                    </div>
                                    <div class="flex items-center justify-between">
                                        <span class="text-gray-300 text-sm">分类</span>
                                        <select class="bg-white/10 rounded-lg px-3 py-1 text-white text-sm outline-none">
                                            <option>育儿工具</option>
                                            <option>健康医疗</option>
                                            <option>生活助手</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Profit Prediction -->
                            <div class="glass-effect rounded-xl p-4">
                                <h3 class="text-white font-medium mb-3">收益预测</h3>
                                <div class="text-center">
                                    <div class="text-2xl font-bold text-green-400 mb-1">¥2,500</div>
                                    <div class="text-gray-400 text-sm mb-3">预计月收益</div>
                                    <div class="text-xs text-gray-500">基于相似应用数据分析</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="px-4 pt-4 space-y-3">
                    <button class="w-full bg-gradient-to-r from-cyan-500 to-purple-600 rounded-2xl py-3 text-white font-semibold neon-glow hover:shadow-lg hover:shadow-cyan-500/25 transition-all duration-300">
                        <i class="fas fa-rocket mr-2"></i>一键发布应用
                    </button>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <button class="glass-effect rounded-xl py-2 text-white font-medium hover:bg-white/10 transition-all duration-300">
                            <i class="fas fa-save mr-2"></i>保存草稿
                        </button>
                        <button class="glass-effect rounded-xl py-2 text-white font-medium hover:bg-white/10 transition-all duration-300">
                            <i class="fas fa-share-alt mr-2"></i>分享预览
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Home Indicator -->
            <div class="home-indicator"></div>
        </div>
    </div>
    
    <script>
        // Tab switching functionality
        const tabs = {
            design: { btn: document.getElementById('designTab'), content: document.getElementById('designContent') },
            preview: { btn: document.getElementById('previewTab'), content: document.getElementById('previewContent') },
            settings: { btn: document.getElementById('settingsTab'), content: document.getElementById('settingsContent') }
        };
        
        function switchTab(activeTab) {
            // Reset all tabs
            Object.values(tabs).forEach(tab => {
                tab.btn.classList.remove('bg-white/10', 'text-white');
                tab.btn.classList.add('text-gray-400');
                tab.content.classList.add('hidden');
            });
            
            // Activate selected tab
            tabs[activeTab].btn.classList.add('bg-white/10', 'text-white');
            tabs[activeTab].btn.classList.remove('text-gray-400');
            tabs[activeTab].content.classList.remove('hidden');
        }
        
        // Add event listeners
        tabs.design.btn.addEventListener('click', () => switchTab('design'));
        tabs.preview.btn.addEventListener('click', () => switchTab('preview'));
        tabs.settings.btn.addEventListener('click', () => switchTab('settings'));
        
        // Drag and drop simulation for components
        document.querySelectorAll('.component-item').forEach(item => {
            item.addEventListener('click', function() {
                // Simulate adding component to canvas
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
            });
        });
        
        // Drop zone interaction
        const dropZone = document.querySelector('.drop-zone');
        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('active');
        });
        
        dropZone.addEventListener('dragleave', function() {
            this.classList.remove('active');
        });
        
        // Button ripple effect
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                const ripple = document.createElement('div');
                ripple.style.position = 'absolute';
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(255, 255, 255, 0.3)';
                ripple.style.transform = 'scale(0)';
                ripple.style.animation = 'ripple 0.6s linear';
                
                const rect = button.getBoundingClientRect();
                const size = Math.max(rect.height, rect.width);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;
                
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                
                button.style.position = 'relative';
                button.style.overflow = 'hidden';
                button.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });
        
        // CSS for ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用创建器 - Aha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glassmorphism {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .cyber-glow {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        
        .neon-text {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }
        
        .ios-button {
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        
        .ios-button:active {
            transform: scale(0.95);
        }
        
        .component-card {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(168, 85, 247, 0.15));
            border: 1px solid rgba(56, 189, 248, 0.3);
            cursor: grab;
        }
        
        .component-card:active {
            cursor: grabbing;
        }
        
        .canvas-area {
            background: 
                radial-gradient(circle at 20% 80%, rgba(56, 189, 248, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.1) 0%, transparent 50%),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.05));
            border: 2px dashed rgba(56, 189, 248, 0.3);
        }
        
        .preview-phone {
            background: #1a1a1a;
            border: 4px solid #333;
            border-radius: 25px;
            position: relative;
        }
        
        .preview-phone::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: #666;
            border-radius: 2px;
        }
        
        .tab-active {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        }
    </style>
</head>
<body class="bg-black text-white">
    <div class="min-h-screen">
        <!-- Header -->
        <div class="flex items-center justify-between p-6 pt-12 glassmorphism border-b border-gray-800">
            <div class="flex items-center space-x-4">
                <button class="w-10 h-10 glassmorphism rounded-2xl flex items-center justify-center ios-button">
                    <i class="fas fa-arrow-left text-gray-300"></i>
                </button>
                <div>
                    <h1 class="text-xl font-semibold neon-text">应用创建器</h1>
                    <p class="text-gray-400 text-sm">智能喂养助手</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button class="px-4 py-2 glassmorphism rounded-xl text-sm ios-button">
                    <i class="fas fa-eye mr-1"></i>预览
                </button>
                <button class="px-4 py-2 bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl text-sm ios-button cyber-glow">
                    <i class="fas fa-rocket mr-1"></i>发布
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex h-screen">
            <!-- Component Library -->
            <div class="w-1/3 p-6 border-r border-gray-800">
                <!-- Tabs -->
                <div class="flex bg-gray-800/50 rounded-2xl p-1 mb-6">
                    <button class="flex-1 py-2 px-3 tab-active text-white rounded-xl text-sm font-semibold ios-button">
                        组件
                    </button>
                    <button class="flex-1 py-2 px-3 text-gray-400 rounded-xl text-sm font-semibold ios-button">
                        模板
                    </button>
                    <button class="flex-1 py-2 px-3 text-gray-400 rounded-xl text-sm font-semibold ios-button">
                        AI助手
                    </button>
                </div>

                <!-- Component Categories -->
                <div class="space-y-4">
                    <div>
                        <h3 class="text-sm font-semibold text-gray-300 mb-3">📱 界面组件</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="component-card p-3 rounded-2xl ios-button">
                                <div class="w-8 h-6 bg-blue-500 rounded mb-2"></div>
                                <p class="text-xs">按钮</p>
                            </div>
                            <div class="component-card p-3 rounded-2xl ios-button">
                                <div class="w-8 h-4 bg-gray-500 rounded mb-2"></div>
                                <p class="text-xs">输入框</p>
                            </div>
                            <div class="component-card p-3 rounded-2xl ios-button">
                                <div class="w-8 h-6 bg-green-500 rounded mb-2"></div>
                                <p class="text-xs">卡片</p>
                            </div>
                            <div class="component-card p-3 rounded-2xl ios-button">
                                <div class="w-8 h-6 bg-purple-500 rounded mb-2"></div>
                                <p class="text-xs">列表</p>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h3 class="text-sm font-semibold text-gray-300 mb-3">📊 数据组件</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="component-card p-3 rounded-2xl ios-button">
                                <div class="w-8 h-6 bg-yellow-500 rounded mb-2"></div>
                                <p class="text-xs">图表</p>
                            </div>
                            <div class="component-card p-3 rounded-2xl ios-button">
                                <div class="w-8 h-6 bg-red-500 rounded mb-2"></div>
                                <p class="text-xs">表格</p>
                            </div>
                            <div class="component-card p-3 rounded-2xl ios-button">
                                <div class="w-8 h-6 bg-indigo-500 rounded mb-2"></div>
                                <p class="text-xs">计数器</p>
                            </div>
                            <div class="component-card p-3 rounded-2xl ios-button">
                                <div class="w-8 h-6 bg-pink-500 rounded mb-2"></div>
                                <p class="text-xs">进度条</p>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h3 class="text-sm font-semibold text-gray-300 mb-3">🧠 AI功能</h3>
                        <div class="space-y-2">
                            <div class="component-card p-3 rounded-2xl ios-button">
                                <div class="flex items-center space-x-2">
                                    <i class="fas fa-calculator text-blue-400"></i>
                                    <p class="text-xs">营养计算器</p>
                                </div>
                            </div>
                            <div class="component-card p-3 rounded-2xl ios-button">
                                <div class="flex items-center space-x-2">
                                    <i class="fas fa-exclamation-triangle text-yellow-400"></i>
                                    <p class="text-xs">过敏原检测</p>
                                </div>
                            </div>
                            <div class="component-card p-3 rounded-2xl ios-button">
                                <div class="flex items-center space-x-2">
                                    <i class="fas fa-utensils text-green-400"></i>
                                    <p class="text-xs">食谱推荐</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Canvas Area -->
            <div class="flex-1 p-6">
                <div class="h-full">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-semibold text-white">设计画布</h3>
                        <div class="flex items-center space-x-2">
                            <span class="text-sm text-gray-400">缩放：</span>
                            <button class="w-8 h-8 glassmorphism rounded-lg flex items-center justify-center ios-button">
                                <i class="fas fa-minus text-xs"></i>
                            </button>
                            <span class="text-sm text-gray-300 px-2">100%</span>
                            <button class="w-8 h-8 glassmorphism rounded-lg flex items-center justify-center ios-button">
                                <i class="fas fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <div class="canvas-area rounded-3xl h-full p-6 relative">
                        <div class="text-center text-gray-400 py-20">
                            <i class="fas fa-mobile-alt text-6xl mb-4 opacity-50"></i>
                            <p class="text-lg mb-2">拖拽组件到这里开始创建</p>
                            <p class="text-sm">或选择右侧的AI生成选项</p>
                        </div>

                        <!-- Sample Components in Canvas -->
                        <div class="absolute top-6 left-6 space-y-4">
                            <div class="glassmorphism p-4 rounded-2xl w-64">
                                <h4 class="font-semibold mb-2">营养计算器</h4>
                                <div class="space-y-2">
                                    <div class="flex justify-between">
                                        <span class="text-sm">蛋白质</span>
                                        <span class="text-sm text-green-400">15.2g</span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span class="text-sm">碳水</span>
                                        <span class="text-sm text-blue-400">8.7g</span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span class="text-sm">脂肪</span>
                                        <span class="text-sm text-yellow-400">3.2g</span>
                                    </div>
                                </div>
                            </div>

                            <div class="glassmorphism p-4 rounded-2xl w-64">
                                <div class="flex items-center space-x-3 mb-3">
                                    <i class="fas fa-exclamation-triangle text-yellow-400"></i>
                                    <span class="font-semibold">过敏原提醒</span>
                                </div>
                                <p class="text-sm text-gray-300">检测到可能的过敏原：鸡蛋、牛奶</p>
                                <button class="w-full mt-3 bg-yellow-500 text-black py-2 rounded-xl text-sm font-semibold ios-button">
                                    查看替代方案
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Preview Panel -->
            <div class="w-1/3 p-6 border-l border-gray-800">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-white">实时预览</h3>
                    <div class="flex space-x-2">
                        <button class="w-8 h-8 glassmorphism rounded-lg flex items-center justify-center ios-button">
                            <i class="fas fa-mobile-alt text-xs"></i>
                        </button>
                        <button class="w-8 h-8 glassmorphism rounded-lg flex items-center justify-center ios-button">
                            <i class="fas fa-tablet-alt text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Phone Preview -->
                <div class="preview-phone mx-auto h-96 w-48 p-4 relative">
                    <div class="bg-gradient-to-b from-gray-900 to-black h-full rounded-2xl p-4 overflow-y-auto">
                        <!-- App Header -->
                        <div class="flex items-center justify-between mb-6 pt-6">
                            <h4 class="font-semibold">智能喂养助手</h4>
                            <i class="fas fa-user-circle text-2xl text-gray-400"></i>
                        </div>

                        <!-- Nutrition Calculator -->
                        <div class="glassmorphism p-3 rounded-2xl mb-4">
                            <h5 class="font-medium mb-2 text-sm">营养计算</h5>
                            <div class="space-y-1 text-xs">
                                <div class="flex justify-between">
                                    <span>蛋白质</span>
                                    <span class="text-green-400">15.2g</span>
                                </div>
                                <div class="flex justify-between">
                                    <span>碳水</span>
                                    <span class="text-blue-400">8.7g</span>
                                </div>
                                <div class="flex justify-between">
                                    <span>脂肪</span>
                                    <span class="text-yellow-400">3.2g</span>
                                </div>
                            </div>
                        </div>

                        <!-- Allergy Alert -->
                        <div class="bg-yellow-500/20 border border-yellow-500/30 p-3 rounded-2xl mb-4">
                            <div class="flex items-center space-x-2 mb-1">
                                <i class="fas fa-exclamation-triangle text-yellow-400 text-xs"></i>
                                <span class="font-medium text-xs">过敏原提醒</span>
                            </div>
                            <p class="text-xs text-gray-300">检测到：鸡蛋、牛奶</p>
                        </div>

                        <!-- Action Button -->
                        <button class="w-full bg-gradient-to-r from-blue-500 to-purple-600 py-3 rounded-2xl text-sm font-semibold">
                            生成食谱建议
                        </button>
                    </div>
                </div>

                <!-- Preview Info -->
                <div class="mt-6 space-y-3">
                    <div class="glassmorphism p-3 rounded-2xl">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-sm font-medium">性能评分</span>
                            <span class="text-green-400 font-semibold">95/100</span>
                        </div>
                        <div class="w-full bg-gray-700 rounded-full h-2">
                            <div class="bg-gradient-to-r from-green-400 to-blue-500 h-2 rounded-full" style="width: 95%"></div>
                        </div>
                    </div>

                    <div class="glassmorphism p-3 rounded-2xl">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-sm font-medium">用户体验</span>
                            <span class="text-blue-400 font-semibold">⭐⭐⭐⭐⭐</span>
                        </div>
                        <p class="text-xs text-gray-400">界面简洁，交互流畅</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Toolbar -->
        <div class="fixed bottom-0 left-0 right-0 glassmorphism border-t border-gray-800 p-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <button class="flex items-center space-x-2 glassmorphism px-4 py-2 rounded-2xl ios-button">
                        <i class="fas fa-undo text-sm"></i>
                        <span class="text-sm">撤销</span>
                    </button>
                    <button class="flex items-center space-x-2 glassmorphism px-4 py-2 rounded-2xl ios-button">
                        <i class="fas fa-redo text-sm"></i>
                        <span class="text-sm">重做</span>
                    </button>
                </div>

                <div class="flex items-center space-x-2">
                    <button class="px-4 py-2 glassmorphism rounded-2xl text-sm ios-button">
                        <i class="fas fa-save mr-1"></i>保存
                    </button>
                    <button class="px-6 py-2 bg-gradient-to-r from-blue-500 to-purple-600 rounded-2xl text-sm font-semibold ios-button cyber-glow">
                        <i class="fas fa-robot mr-1"></i>AI优化
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

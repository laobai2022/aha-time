<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aha - 灵感捕捉</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'SF Pro Display', system-ui, -apple-system, sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .neon-glow {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        
        .device-frame {
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 45px;
            padding: 8px;
            margin: 0 auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        
        .device-screen {
            width: 100%;
            height: 100%;
            border-radius: 37px;
            overflow: hidden;
            position: relative;
        }
        
        .status-bar {
            height: 44px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
        }
        
        .home-indicator {
            width: 134px;
            height: 5px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 3px;
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .recording-pulse {
            animation: recordPulse 1.5s infinite;
        }
        
        @keyframes recordPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        
        .drawing-canvas {
            background: rgba(255, 255, 255, 0.02);
            border: 2px dashed rgba(0, 255, 255, 0.3);
        }
        
        .ai-suggestion {
            animation: slideInUp 0.5s ease-out;
        }
        
        @keyframes slideInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .wave-animation {
            animation: wave 2s infinite;
        }
        
        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }
    </style>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-4">
    <!-- Device Frame -->
    <div class="device-frame">
        <div class="device-screen gradient-bg relative overflow-hidden">
            <!-- Status Bar -->
            <div class="status-bar">
                <div class="flex items-center">
                    <i class="fas fa-arrow-left text-white text-lg mr-3 cursor-pointer"></i>
                    <div class="text-white text-sm font-medium">9:41</div>
                </div>
                <div class="flex items-center space-x-1">
                    <i class="fas fa-signal text-white text-xs"></i>
                    <i class="fas fa-wifi text-white text-xs"></i>
                    <div class="w-6 h-3 border border-white rounded-sm">
                        <div class="w-4 h-1.5 bg-white rounded-sm m-0.5"></div>
                    </div>
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="flex flex-col h-full pt-16 pb-8">
                <!-- Header -->
                <div class="px-6 mb-6">
                    <h1 class="text-2xl font-bold text-white mb-2">
                        <i class="fas fa-lightbulb text-cyan-400 mr-2"></i>
                        灵感捕捉
                    </h1>
                    <p class="text-gray-400">记录您的创意想法，让AI帮您完善</p>
                </div>
                
                <!-- Input Methods -->
                <div class="px-6 mb-6">
                    <div class="grid grid-cols-3 gap-3">
                        <!-- Voice Input -->
                        <button id="voiceBtn" class="glass-effect rounded-xl p-4 text-center hover:bg-white/10 transition-all duration-300">
                            <i class="fas fa-microphone text-xl text-green-400 mb-2"></i>
                            <div class="text-white text-sm font-medium">语音</div>
                        </button>
                        
                        <!-- Text Input -->
                        <button id="textBtn" class="glass-effect rounded-xl p-4 text-center hover:bg-white/10 transition-all duration-300 bg-white/5">
                            <i class="fas fa-keyboard text-xl text-blue-400 mb-2"></i>
                            <div class="text-white text-sm font-medium">文字</div>
                        </button>
                        
                        <!-- Drawing Input -->
                        <button id="drawBtn" class="glass-effect rounded-xl p-4 text-center hover:bg-white/10 transition-all duration-300">
                            <i class="fas fa-paint-brush text-xl text-purple-400 mb-2"></i>
                            <div class="text-white text-sm font-medium">涂鸦</div>
                        </button>
                    </div>
                </div>
                
                <!-- Content Area -->
                <div class="flex-1 px-6">
                    <!-- Text Input Area -->
                    <div id="textInput" class="glass-effect rounded-2xl p-4 mb-4">
                        <textarea 
                            placeholder="描述您的灵感想法... 例如：我想做一个帮助妈妈计算辅食营养的工具"
                            class="w-full h-32 bg-transparent text-white placeholder-gray-500 outline-none resize-none text-base leading-relaxed"
                        ></textarea>
                    </div>
                    
                    <!-- Voice Recording Area (Hidden by default) -->
                    <div id="voiceInput" class="glass-effect rounded-2xl p-6 mb-4 text-center hidden">
                        <div class="w-24 h-24 mx-auto mb-4 rounded-full bg-gradient-to-r from-green-500 to-green-600 flex items-center justify-center recording-pulse">
                            <i class="fas fa-microphone text-3xl text-white"></i>
                        </div>
                        <div class="text-white font-medium mb-2">正在录音...</div>
                        <div class="text-gray-400 text-sm">请说出您的灵感想法</div>
                        
                        <!-- Audio Wave Animation -->
                        <div class="flex justify-center items-center mt-4 space-x-1">
                            <div class="w-1 h-8 bg-green-400 rounded wave-animation" style="animation-delay: 0s;"></div>
                            <div class="w-1 h-6 bg-green-400 rounded wave-animation" style="animation-delay: 0.1s;"></div>
                            <div class="w-1 h-10 bg-green-400 rounded wave-animation" style="animation-delay: 0.2s;"></div>
                            <div class="w-1 h-4 bg-green-400 rounded wave-animation" style="animation-delay: 0.3s;"></div>
                            <div class="w-1 h-8 bg-green-400 rounded wave-animation" style="animation-delay: 0.4s;"></div>
                        </div>
                    </div>
                    
                    <!-- Drawing Area (Hidden by default) -->
                    <div id="drawInput" class="glass-effect rounded-2xl p-4 mb-4 hidden">
                        <div class="drawing-canvas rounded-xl h-40 flex items-center justify-center">
                            <div class="text-center text-gray-400">
                                <i class="fas fa-pencil-alt text-2xl mb-2"></i>
                                <div class="text-sm">在此处绘制您的想法</div>
                            </div>
                        </div>
                        <div class="flex justify-center mt-3 space-x-4">
                            <button class="text-cyan-400 hover:text-cyan-300">
                                <i class="fas fa-palette"></i>
                            </button>
                            <button class="text-cyan-400 hover:text-cyan-300">
                                <i class="fas fa-undo"></i>
                            </button>
                            <button class="text-cyan-400 hover:text-cyan-300">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- AI Suggestions -->
                    <div class="ai-suggestion glass-effect rounded-2xl p-4 mb-4">
                        <div class="flex items-center mb-3">
                            <i class="fas fa-robot text-cyan-400 mr-2"></i>
                            <span class="text-white font-medium">AI 智能建议</span>
                        </div>
                        
                        <div class="space-y-3">
                            <div class="bg-gradient-to-r from-cyan-500/20 to-purple-500/20 rounded-xl p-3 border border-cyan-400/30">
                                <div class="text-cyan-300 text-sm font-medium mb-1">功能建议</div>
                                <div class="text-white text-sm">添加营养成分数据库和推荐算法</div>
                            </div>
                            
                            <div class="bg-gradient-to-r from-green-500/20 to-blue-500/20 rounded-xl p-3 border border-green-400/30">
                                <div class="text-green-300 text-sm font-medium mb-1">市场预测</div>
                                <div class="text-white text-sm">预计月收益：¥2,000 - ¥5,000</div>
                            </div>
                            
                            <div class="bg-gradient-to-r from-purple-500/20 to-pink-500/20 rounded-xl p-3 border border-purple-400/30">
                                <div class="text-purple-300 text-sm font-medium mb-1">技术可行性</div>
                                <div class="text-white text-sm">开发难度：简单 | 预计耗时：3-5天</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="px-6 space-y-3">
                    <button class="w-full bg-gradient-to-r from-cyan-500 to-purple-600 rounded-2xl py-4 text-white font-semibold text-lg neon-glow hover:shadow-lg hover:shadow-cyan-500/25 transition-all duration-300">
                        <i class="fas fa-magic mr-2"></i>生成应用原型
                    </button>
                    
                    <button class="w-full glass-effect rounded-2xl py-3 text-white font-medium hover:bg-white/10 transition-all duration-300">
                        <i class="fas fa-save mr-2"></i>保存到灵感库
                    </button>
                </div>
            </div>
            
            <!-- Home Indicator -->
            <div class="home-indicator"></div>
        </div>
    </div>
    
    <script>
        // Input method switching
        const textBtn = document.getElementById('textBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const drawBtn = document.getElementById('drawBtn');
        
        const textInput = document.getElementById('textInput');
        const voiceInput = document.getElementById('voiceInput');
        const drawInput = document.getElementById('drawInput');
        
        function switchInputMethod(activeBtn, activeInput) {
            // Reset all buttons
            [textBtn, voiceBtn, drawBtn].forEach(btn => {
                btn.classList.remove('bg-white/5');
            });
            
            // Hide all inputs
            [textInput, voiceInput, drawInput].forEach(input => {
                input.classList.add('hidden');
            });
            
            // Activate selected
            activeBtn.classList.add('bg-white/5');
            activeInput.classList.remove('hidden');
        }
        
        textBtn.addEventListener('click', () => {
            switchInputMethod(textBtn, textInput);
        });
        
        voiceBtn.addEventListener('click', () => {
            switchInputMethod(voiceBtn, voiceInput);
            // Simulate voice recording
            setTimeout(() => {
                switchInputMethod(textBtn, textInput);
                document.querySelector('textarea').value = '我想做一个帮助妈妈计算辅食营养配比的智能助手，能够根据宝宝年龄推荐合适的食谱';
            }, 3000);
        });
        
        drawBtn.addEventListener('click', () => {
            switchInputMethod(drawBtn, drawInput);
        });
        
        // Button ripple effect
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                const ripple = document.createElement('div');
                ripple.style.position = 'absolute';
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(255, 255, 255, 0.3)';
                ripple.style.transform = 'scale(0)';
                ripple.style.animation = 'ripple 0.6s linear';
                ripple.style.left = (e.clientX - button.offsetLeft) + 'px';
                ripple.style.top = (e.clientY - button.offsetTop) + 'px';
                ripple.style.width = ripple.style.height = '20px';
                button.style.position = 'relative';
                button.style.overflow = 'hidden';
                button.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });
        
        // CSS for ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>

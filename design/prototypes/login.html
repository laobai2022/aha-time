<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aha - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'SF Pro Display', system-ui, -apple-system, sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .neon-glow {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        
        .device-frame {
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 45px;
            padding: 8px;
            margin: 0 auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        
        .device-screen {
            width: 100%;
            height: 100%;
            border-radius: 37px;
            overflow: hidden;
            position: relative;
        }
        
        .status-bar {
            height: 44px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
        }
        
        .home-indicator {
            width: 134px;
            height: 5px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 3px;
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            border-radius: 50%;
            animation: float 6s infinite linear;
        }
        
        @keyframes float {
            0% { transform: translateY(100vh) translateX(0px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) translateX(100px); opacity: 0; }
        }
    </style>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-4">
    <!-- Device Frame -->
    <div class="device-frame">
        <div class="device-screen gradient-bg relative overflow-hidden">
            <!-- Floating particles background -->
            <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
            <div class="particle" style="left: 20%; animation-delay: 1s;"></div>
            <div class="particle" style="left: 30%; animation-delay: 2s;"></div>
            <div class="particle" style="left: 40%; animation-delay: 3s;"></div>
            <div class="particle" style="left: 50%; animation-delay: 4s;"></div>
            <div class="particle" style="left: 60%; animation-delay: 5s;"></div>
            <div class="particle" style="left: 70%; animation-delay: 2.5s;"></div>
            <div class="particle" style="left: 80%; animation-delay: 1.5s;"></div>
            <div class="particle" style="left: 90%; animation-delay: 3.5s;"></div>
            
            <!-- Status Bar -->
            <div class="status-bar">
                <div class="text-white text-sm font-medium">9:41</div>
                <div class="flex items-center space-x-1">
                    <i class="fas fa-signal text-white text-xs"></i>
                    <i class="fas fa-wifi text-white text-xs"></i>
                    <div class="w-6 h-3 border border-white rounded-sm">
                        <div class="w-4 h-1.5 bg-white rounded-sm m-0.5"></div>
                    </div>
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="flex flex-col h-full pt-16 pb-8 px-6">
                <!-- Logo and Title -->
                <div class="text-center mt-8 mb-12">
                    <div class="w-20 h-20 mx-auto mb-6 relative">
                        <div class="w-full h-full rounded-3xl glass-effect flex items-center justify-center neon-glow pulse-animation">
                            <i class="fas fa-lightbulb text-3xl text-cyan-400"></i>
                        </div>
                    </div>
                    <h1 class="text-4xl font-bold text-white mb-2">Aha</h1>
                    <p class="text-gray-400 text-lg">灵感变现即时操作系统</p>
                </div>
                
                <!-- Login Form -->
                <div class="flex-1 space-y-6">
                    <!-- Email Input -->
                    <div class="relative">
                        <div class="glass-effect rounded-2xl p-4">
                            <label class="text-cyan-400 text-sm font-medium block mb-2">
                                <i class="fas fa-envelope mr-2"></i>邮箱地址
                            </label>
                            <input 
                                type="email" 
                                placeholder="请输入您的邮箱"
                                class="w-full bg-transparent text-white placeholder-gray-500 outline-none text-lg"
                            >
                        </div>
                    </div>
                    
                    <!-- Password Input -->
                    <div class="relative">
                        <div class="glass-effect rounded-2xl p-4">
                            <label class="text-cyan-400 text-sm font-medium block mb-2">
                                <i class="fas fa-lock mr-2"></i>密码
                            </label>
                            <div class="flex items-center">
                                <input 
                                    type="password" 
                                    placeholder="请输入密码"
                                    class="flex-1 bg-transparent text-white placeholder-gray-500 outline-none text-lg"
                                >
                                <i class="fas fa-eye text-gray-400 cursor-pointer"></i>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Login Button -->
                    <button class="w-full bg-gradient-to-r from-cyan-500 to-purple-600 rounded-2xl py-4 text-white font-semibold text-lg neon-glow hover:shadow-lg hover:shadow-cyan-500/25 transition-all duration-300 transform hover:scale-105">
                        <i class="fas fa-rocket mr-2"></i>开启创意之旅
                    </button>
                    
                    <!-- Social Login -->
                    <div class="space-y-3">
                        <div class="text-center text-gray-400 text-sm">或使用以下方式登录</div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <button class="glass-effect rounded-xl py-3 text-white font-medium hover:bg-white/10 transition-all duration-300">
                                <i class="fab fa-google mr-2 text-blue-400"></i>Google
                            </button>
                            <button class="glass-effect rounded-xl py-3 text-white font-medium hover:bg-white/10 transition-all duration-300">
                                <i class="fab fa-weixin mr-2 text-green-400"></i>微信
                            </button>
                        </div>
                    </div>
                    
                    <!-- Register Link -->
                    <div class="text-center pt-6 border-t border-gray-700">
                        <span class="text-gray-400">还没有账户？</span>
                        <a href="#" class="text-cyan-400 font-medium ml-2 hover:text-cyan-300 transition-colors">
                            立即注册 <i class="fas fa-arrow-right ml-1"></i>
                        </a>
                    </div>
                </div>
            </div>
            
            <!-- Home Indicator -->
            <div class="home-indicator"></div>
        </div>
    </div>
    
    <script>
        // Add interactive feedback
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                const ripple = document.createElement('div');
                ripple.style.position = 'absolute';
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(255, 255, 255, 0.3)';
                ripple.style.transform = 'scale(0)';
                ripple.style.animation = 'ripple 0.6s linear';
                ripple.style.left = (e.clientX - button.offsetLeft) + 'px';
                ripple.style.top = (e.clientY - button.offsetTop) + 'px';
                ripple.style.width = ripple.style.height = '20px';
                button.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });
        
        // CSS for ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>

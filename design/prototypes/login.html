<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Aha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glassmorphism {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .cyber-glow {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        
        .neon-text {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }
        
        .particle-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 30% 30%, rgba(56, 189, 248, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(168, 85, 247, 0.15) 0%, transparent 50%);
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .floating {
            animation: float 3s ease-in-out infinite;
        }
        
        .pulse-glow {
            animation: pulse 2s ease-in-out infinite;
        }
        
        .ios-button {
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        
        .ios-button:active {
            transform: scale(0.95);
        }
        
        .ios-input {
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .ios-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen">
    <!-- Particle Background -->
    <div class="particle-bg"></div>
    
    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-sm">
            <!-- Logo and Title -->
            <div class="text-center mb-12">
                <div class="w-20 h-20 bg-gradient-to-r from-blue-500 to-purple-600 rounded-3xl flex items-center justify-center mx-auto mb-6 cyber-glow floating">
                    <i class="fas fa-lightbulb text-white text-3xl"></i>
                </div>
                <h1 class="text-4xl font-bold text-white mb-3 neon-text">Aha</h1>
                <p class="text-gray-400 text-lg">灵感变现平台</p>
                <p class="text-gray-500 text-sm mt-2">让每个灵感瞬间都能成为数字资产</p>
            </div>

            <!-- Login Form -->
            <div class="glassmorphism rounded-3xl p-8 mb-8">
                <!-- Tab Selector -->
                <div class="flex bg-gray-800/50 rounded-2xl p-1 mb-8">
                    <button class="flex-1 py-3 px-4 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-xl text-sm font-semibold ios-button">
                        登录
                    </button>
                    <button class="flex-1 py-3 px-4 text-gray-400 rounded-xl text-sm font-semibold ios-button">
                        注册
                    </button>
                </div>

                <!-- Social Login -->
                <div class="space-y-4 mb-8">
                    <button class="w-full bg-white text-black py-4 px-6 rounded-2xl font-semibold flex items-center justify-center space-x-3 ios-button hover:bg-gray-100 transition-colors">
                        <i class="fab fa-google text-red-500 text-lg"></i>
                        <span>使用 Google 登录</span>
                    </button>
                    
                    <button class="w-full bg-green-500 text-white py-4 px-6 rounded-2xl font-semibold flex items-center justify-center space-x-3 ios-button hover:bg-green-600 transition-colors">
                        <i class="fab fa-weixin text-lg"></i>
                        <span>使用微信登录</span>
                    </button>
                </div>

                <!-- Divider -->
                <div class="flex items-center mb-8">
                    <div class="flex-1 border-t border-gray-600"></div>
                    <span class="px-4 text-gray-400 text-sm">或使用邮箱登录</span>
                    <div class="flex-1 border-t border-gray-600"></div>
                </div>

                <!-- Email Login Form -->
                <form class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-300 mb-3">邮箱地址</label>
                        <input 
                            type="email" 
                            id="email" 
                            class="w-full ios-input px-4 py-4 text-white placeholder-gray-400 focus:outline-none"
                            placeholder="请输入您的邮箱地址"
                        >
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-300 mb-3">密码</label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="password" 
                                class="w-full ios-input px-4 py-4 text-white placeholder-gray-400 focus:outline-none pr-12"
                                placeholder="请输入您的密码"
                            >
                            <button type="button" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white transition-colors">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="flex items-center">
                            <input type="checkbox" class="rounded border-gray-600 text-blue-500 focus:ring-blue-500 bg-gray-700/50 border-none">
                            <span class="ml-3 text-sm text-gray-300">30天免登录</span>
                        </label>
                        <a href="#" class="text-sm text-blue-400 hover:text-blue-300 transition-colors">忘记密码？</a>
                    </div>

                    <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-4 px-6 rounded-2xl font-semibold ios-button cyber-glow hover:from-blue-600 hover:to-purple-700 transition-all duration-200">
                        登录
                    </button>
                </form>

                <!-- Biometric Login -->
                <div class="mt-6 text-center">
                    <p class="text-gray-400 text-sm mb-4">或使用生物识别</p>
                    <div class="flex justify-center space-x-6">
                        <button class="w-12 h-12 bg-gray-700/50 rounded-2xl flex items-center justify-center hover:bg-gray-600/50 transition-colors">
                            <i class="fas fa-fingerprint text-blue-400 text-xl"></i>
                        </button>
                        <button class="w-12 h-12 bg-gray-700/50 rounded-2xl flex items-center justify-center hover:bg-gray-600/50 transition-colors">
                            <i class="fas fa-eye text-purple-400 text-xl"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Feature Preview -->
            <div class="grid grid-cols-3 gap-4 text-center">
                <div class="glassmorphism rounded-2xl p-4">
                    <i class="fas fa-brain text-blue-400 text-2xl mb-2 pulse-glow"></i>
                    <p class="text-xs text-gray-300">AI灵感助手</p>
                </div>
                <div class="glassmorphism rounded-2xl p-4">
                    <i class="fas fa-rocket text-green-400 text-2xl mb-2 pulse-glow"></i>
                    <p class="text-xs text-gray-300">零代码创建</p>
                </div>
                <div class="glassmorphism rounded-2xl p-4">
                    <i class="fas fa-coins text-yellow-400 text-2xl mb-2 pulse-glow"></i>
                    <p class="text-xs text-gray-300">即时变现</p>
                </div>
            </div>

            <!-- Footer -->
            <div class="text-center mt-8">
                <p class="text-gray-500 text-xs">
                    登录即表示同意 <a href="#" class="text-blue-400">服务条款</a> 和 <a href="#" class="text-blue-400">隐私政策</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感记录 - Aha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glassmorphism {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .cyber-glow {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        
        .neon-text {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }
        
        .voice-pulse {
            box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7);
            animation: voice-pulse 2s infinite;
        }
        
        @keyframes voice-pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(56, 189, 248, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(56, 189, 248, 0);
            }
        }
        
        .drawing-canvas {
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(56, 189, 248, 0.3);
        }
        
        .ios-button {
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        
        .ios-button:active {
            transform: scale(0.95);
        }
        
        .category-tag {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(168, 85, 247, 0.2));
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        
        .ai-suggestion {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.1), rgba(56, 189, 248, 0.1));
            border-left: 3px solid #a855f7;
        }
    </style>
</head>
<body class="bg-black text-white">
    <div class="min-h-screen p-6">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8 pt-12">
            <button class="w-10 h-10 glassmorphism rounded-2xl flex items-center justify-center ios-button">
                <i class="fas fa-arrow-left text-gray-300"></i>
            </button>
            <h1 class="text-xl font-semibold neon-text">记录灵感</h1>
            <button class="w-10 h-10 glassmorphism rounded-2xl flex items-center justify-center ios-button">
                <i class="fas fa-question-circle text-gray-300"></i>
            </button>
        </div>

        <!-- Inspiration Input -->
        <div class="glassmorphism rounded-3xl p-6 mb-6">
            <div class="mb-6">
                <label class="block text-lg font-medium text-white mb-4">💡 你的灵感是什么？</label>
                <textarea 
                    class="w-full h-32 bg-gray-800/50 rounded-2xl p-4 text-white placeholder-gray-400 border border-gray-600 focus:border-blue-500 focus:outline-none resize-none"
                    placeholder="描述你的想法...比如：我想要一个帮助宝妈计算辅食营养的工具"
                ></textarea>
            </div>

            <!-- Voice Input -->
            <div class="flex items-center justify-center mb-6">
                <button class="w-20 h-20 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full flex items-center justify-center cyber-glow voice-pulse ios-button">
                    <i class="fas fa-microphone text-white text-2xl"></i>
                </button>
            </div>
            <p class="text-center text-gray-400 text-sm mb-6">长按录音（最长60秒）</p>

            <!-- Drawing Canvas -->
            <div class="mb-6">
                <p class="text-sm font-medium text-gray-300 mb-3">✏️ 或者画出你的想法</p>
                <div class="drawing-canvas rounded-2xl h-48 flex items-center justify-center">
                    <div class="text-center text-gray-400">
                        <i class="fas fa-pencil-alt text-3xl mb-2"></i>
                        <p class="text-sm">点击开始涂鸦</p>
                    </div>
                </div>
                <div class="flex justify-between items-center mt-3">
                    <div class="flex space-x-2">
                        <button class="w-8 h-8 bg-blue-500 rounded-full ios-button"></button>
                        <button class="w-8 h-8 bg-red-500 rounded-full ios-button"></button>
                        <button class="w-8 h-8 bg-green-500 rounded-full ios-button"></button>
                        <button class="w-8 h-8 bg-yellow-500 rounded-full ios-button"></button>
                    </div>
                    <div class="flex space-x-2">
                        <button class="px-3 py-1 glassmorphism rounded-xl text-xs ios-button">
                            <i class="fas fa-undo"></i>
                        </button>
                        <button class="px-3 py-1 glassmorphism rounded-xl text-xs ios-button">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Category Selection -->
        <div class="glassmorphism rounded-3xl p-6 mb-6">
            <h3 class="text-lg font-medium text-white mb-4">🏷️ 选择类别</h3>
            <div class="grid grid-cols-2 gap-3">
                <button class="category-tag p-3 rounded-2xl text-center ios-button">
                    <i class="fas fa-baby text-blue-400 text-lg mb-1"></i>
                    <p class="text-sm">生活类</p>
                </button>
                <button class="category-tag p-3 rounded-2xl text-center ios-button">
                    <i class="fas fa-utensils text-green-400 text-lg mb-1"></i>
                    <p class="text-sm">餐饮类</p>
                </button>
                <button class="category-tag p-3 rounded-2xl text-center ios-button">
                    <i class="fas fa-gamepad text-purple-400 text-lg mb-1"></i>
                    <p class="text-sm">休闲类</p>
                </button>
                <button class="category-tag p-3 rounded-2xl text-center ios-button">
                    <i class="fas fa-briefcase text-yellow-400 text-lg mb-1"></i>
                    <p class="text-sm">商务类</p>
                </button>
            </div>
        </div>

        <!-- AI Suggestions -->
        <div class="glassmorphism rounded-3xl p-6 mb-6">
            <div class="flex items-center mb-4">
                <i class="fas fa-robot text-blue-400 text-lg mr-2"></i>
                <h3 class="text-lg font-medium text-white">AI 智能建议</h3>
            </div>
            
            <div class="space-y-4">
                <div class="ai-suggestion rounded-2xl p-4">
                    <div class="flex items-start space-x-3">
                        <i class="fas fa-lightbulb text-yellow-400 text-lg mt-1"></i>
                        <div>
                            <p class="text-white font-medium mb-1">功能增强建议</p>
                            <p class="text-gray-400 text-sm">为您的辅食工具添加过敏原检测和营养搭配建议功能</p>
                        </div>
                    </div>
                </div>
                
                <div class="ai-suggestion rounded-2xl p-4">
                    <div class="flex items-start space-x-3">
                        <i class="fas fa-chart-line text-green-400 text-lg mt-1"></i>
                        <div>
                            <p class="text-white font-medium mb-1">变现潜力分析</p>
                            <p class="text-gray-400 text-sm">预计收益：¥2000-5000/月，市场需求度：⭐⭐⭐⭐⭐</p>
                        </div>
                    </div>
                </div>
                
                <div class="ai-suggestion rounded-2xl p-4">
                    <div class="flex items-start space-x-3">
                        <i class="fas fa-users text-blue-400 text-lg mt-1"></i>
                        <div>
                            <p class="text-white font-medium mb-1">目标用户画像</p>
                            <p class="text-gray-400 text-sm">25-35岁新手妈妈，月收入8K+，注重科学育儿</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="space-y-4">
            <button class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-4 px-6 rounded-2xl font-semibold ios-button cyber-glow">
                📱 立即创建应用
            </button>
            
            <button class="w-full glassmorphism text-white py-4 px-6 rounded-2xl font-semibold ios-button">
                💾 保存到灵感库
            </button>
        </div>

        <!-- Progress Indicator -->
        <div class="mt-8 text-center">
            <div class="flex justify-center space-x-2 mb-2">
                <div class="w-2 h-2 bg-blue-500 rounded-full"></div>
                <div class="w-2 h-2 bg-gray-600 rounded-full"></div>
                <div class="w-2 h-2 bg-gray-600 rounded-full"></div>
            </div>
            <p class="text-gray-400 text-xs">第1步 / 共3步</p>
        </div>
    </div>

    <!-- Floating AI Assistant -->
    <div class="fixed bottom-6 right-6">
        <button class="w-14 h-14 bg-gradient-to-r from-purple-500 to-pink-500 rounded-full flex items-center justify-center cyber-glow ios-button">
            <i class="fas fa-robot text-white text-xl"></i>
        </button>
    </div>
</body>
</html>

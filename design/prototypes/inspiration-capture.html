<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感记录器 - Aha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glassmorphism {
            background: rgba(139, 92, 246, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .recording-pulse {
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            70% {
                transform: scale(1.05);
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        .ai-thinking {
            animation: thinking 1.5s ease-in-out infinite;
        }

        @keyframes thinking {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .sketch-canvas {
            background: 
                linear-gradient(90deg, rgba(139, 92, 246, 0.1) 1px, transparent 1px),
                linear-gradient(rgba(139, 92, 246, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .floating-button {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .voice-wave {
            animation: wave 1s ease-in-out infinite alternate;
        }

        @keyframes wave {
            from { height: 8px; }
            to { height: 24px; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-indigo-900 min-h-screen text-white">
    <!-- 状态栏 -->
    <div class="flex justify-between items-center px-6 py-2 text-sm">
        <span class="text-purple-300 font-semibold">9:41</span>
        <div class="flex items-center space-x-2">
            <div class="flex space-x-1">
                <div class="w-1 h-3 bg-purple-400 rounded-full"></div>
                <div class="w-1 h-4 bg-purple-400 rounded-full"></div>
                <div class="w-1 h-5 bg-purple-400 rounded-full"></div>
                <div class="w-1 h-6 bg-purple-400 rounded-full"></div>
            </div>
            <i class="fas fa-wifi text-purple-400 text-sm"></i>
            <div class="w-6 h-3 border border-purple-400 rounded-sm relative">
                <div class="absolute inset-0.5 bg-gradient-to-r from-green-400 to-purple-500 rounded-sm"></div>
            </div>
        </div>
    </div>

    <!-- 顶部导航 -->
    <div class="flex items-center justify-between px-6 py-4">
        <button class="glassmorphism rounded-full p-2">
            <i class="fas fa-arrow-left text-purple-300"></i>
        </button>
        <h1 class="text-lg font-semibold text-white">灵感记录器</h1>
        <button class="glassmorphism rounded-full p-2">
            <i class="fas fa-history text-purple-300"></i>
        </button>
    </div>

    <!-- 主要内容区域 -->
    <div class="px-6 pb-24">
        <!-- 记录方式选择 -->
        <div class="mb-6">
            <div class="grid grid-cols-3 gap-3">
                <button class="glassmorphism rounded-2xl p-4 text-center border-2 border-purple-500 bg-purple-500/20">
                    <i class="fas fa-microphone text-purple-400 text-2xl mb-2"></i>
                    <p class="text-xs text-purple-200">语音输入</p>
                </button>
                <button class="glassmorphism rounded-2xl p-4 text-center">
                    <i class="fas fa-edit text-blue-400 text-2xl mb-2"></i>
                    <p class="text-xs text-blue-200">文字记录</p>
                </button>
                <button class="glassmorphism rounded-2xl p-4 text-center">
                    <i class="fas fa-palette text-green-400 text-2xl mb-2"></i>
                    <p class="text-xs text-green-200">涂鸦草图</p>
                </button>
            </div>
        </div>

        <!-- 语音录制区域 -->
        <div class="glassmorphism rounded-3xl p-6 mb-6">
            <div class="text-center mb-6">
                <h3 class="text-lg font-semibold text-white mb-2">说出您的灵感</h3>
                <p class="text-gray-400 text-sm">60秒内描述您的想法</p>
            </div>

            <!-- 录音按钮 -->
            <div class="flex justify-center mb-6">
                <button class="w-24 h-24 bg-gradient-to-r from-red-500 to-pink-500 rounded-full flex items-center justify-center recording-pulse">
                    <i class="fas fa-microphone text-white text-3xl"></i>
                </button>
            </div>

            <!-- 音波可视化 -->
            <div class="flex justify-center items-end space-x-1 mb-6 h-12">
                <div class="w-1 bg-purple-400 rounded-full voice-wave" style="animation-delay: 0s;"></div>
                <div class="w-1 bg-blue-400 rounded-full voice-wave" style="animation-delay: 0.1s;"></div>
                <div class="w-1 bg-green-400 rounded-full voice-wave" style="animation-delay: 0.2s;"></div>
                <div class="w-1 bg-yellow-400 rounded-full voice-wave" style="animation-delay: 0.3s;"></div>
                <div class="w-1 bg-red-400 rounded-full voice-wave" style="animation-delay: 0.4s;"></div>
                <div class="w-1 bg-purple-400 rounded-full voice-wave" style="animation-delay: 0.5s;"></div>
                <div class="w-1 bg-blue-400 rounded-full voice-wave" style="animation-delay: 0.6s;"></div>
                <div class="w-1 bg-green-400 rounded-full voice-wave" style="animation-delay: 0.7s;"></div>
                <div class="w-1 bg-yellow-400 rounded-full voice-wave" style="animation-delay: 0.8s;"></div>
                <div class="w-1 bg-red-400 rounded-full voice-wave" style="animation-delay: 0.9s;"></div>
            </div>

            <!-- 录音状态 -->
            <div class="text-center">
                <p class="text-green-400 font-medium mb-1">正在录音...</p>
                <p class="text-gray-400 text-sm">0:45 / 1:00</p>
            </div>

            <!-- 录音控制 -->
            <div class="flex justify-center space-x-4 mt-6">
                <button class="glassmorphism rounded-full p-3">
                    <i class="fas fa-pause text-white"></i>
                </button>
                <button class="glassmorphism rounded-full p-3">
                    <i class="fas fa-stop text-red-400"></i>
                </button>
                <button class="glassmorphism rounded-full p-3">
                    <i class="fas fa-redo text-gray-400"></i>
                </button>
            </div>
        </div>

        <!-- AI解析结果 -->
        <div class="glassmorphism rounded-3xl p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-white">AI解析结果</h3>
                <div class="flex items-center space-x-2 ai-thinking">
                    <div class="w-2 h-2 bg-blue-400 rounded-full"></div>
                    <div class="w-2 h-2 bg-green-400 rounded-full"></div>
                    <div class="w-2 h-2 bg-purple-400 rounded-full"></div>
                </div>
            </div>

            <!-- 识别的文本 -->
            <div class="mb-4">
                <p class="text-gray-400 text-sm mb-2">识别文本:</p>
                <div class="glassmorphism rounded-2xl p-4">
                    <p class="text-white leading-relaxed">
                        "我想做一个帮助宝妈计算婴儿辅食营养配比的应用，能够根据宝宝的年龄、体重和过敏史，推荐每日的营养搭配方案，还能记录宝宝的进食情况..."
                    </p>
                </div>
            </div>

            <!-- AI补全建议 -->
            <div class="mb-4">
                <p class="text-gray-400 text-sm mb-2">AI智能补全:</p>
                <div class="space-y-2">
                    <div class="glassmorphism rounded-2xl p-3 border-l-4 border-blue-500">
                        <p class="text-blue-200 text-sm">
                            <i class="fas fa-lightbulb mr-2"></i>
                            建议添加：食物过敏预警功能
                        </p>
                    </div>
                    <div class="glassmorphism rounded-2xl p-3 border-l-4 border-green-500">
                        <p class="text-green-200 text-sm">
                            <i class="fas fa-chart-line mr-2"></i>
                            建议添加：宝宝成长数据追踪
                        </p>
                    </div>
                    <div class="glassmorphism rounded-2xl p-3 border-l-4 border-purple-500">
                        <p class="text-purple-200 text-sm">
                            <i class="fas fa-users mr-2"></i>
                            建议添加：宝妈交流社区功能
                        </p>
                    </div>
                </div>
            </div>

            <!-- 可行性分析 -->
            <div class="glassmorphism rounded-2xl p-4 bg-gradient-to-r from-green-500/10 to-blue-500/10">
                <div class="flex items-center justify-between mb-2">
                    <h4 class="font-medium text-white">可行性分析</h4>
                    <span class="text-green-400 font-semibold">95%</span>
                </div>
                <div class="grid grid-cols-2 gap-4 text-sm">
                    <div>
                        <p class="text-gray-400">预估开发成本</p>
                        <p class="text-white font-medium">¥2,800</p>
                    </div>
                    <div>
                        <p class="text-gray-400">预期月收益</p>
                        <p class="text-green-400 font-medium">¥800-1,500</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 灵感分类 -->
        <div class="glassmorphism rounded-3xl p-6 mb-6">
            <h3 class="text-lg font-semibold text-white mb-4">选择灵感分类</h3>
            <div class="grid grid-cols-2 gap-3">
                <button class="glassmorphism rounded-2xl p-4 border-2 border-pink-500 bg-pink-500/20">
                    <i class="fas fa-heart text-pink-400 text-xl mb-2"></i>
                    <p class="text-pink-200 text-sm">生活助手</p>
                </button>
                <button class="glassmorphism rounded-2xl p-4">
                    <i class="fas fa-briefcase text-blue-400 text-xl mb-2"></i>
                    <p class="text-blue-200 text-sm">工作效率</p>
                </button>
                <button class="glassmorphism rounded-2xl p-4">
                    <i class="fas fa-graduation-cap text-green-400 text-xl mb-2"></i>
                    <p class="text-green-200 text-sm">教育学习</p>
                </button>
                <button class="glassmorphism rounded-2xl p-4">
                    <i class="fas fa-gamepad text-purple-400 text-xl mb-2"></i>
                    <p class="text-purple-200 text-sm">娱乐休闲</p>
                </button>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="space-y-4">
            <button class="w-full bg-gradient-to-r from-purple-500 to-blue-500 rounded-2xl py-4 px-6 text-white font-semibold text-lg floating-button">
                <i class="fas fa-save mr-2"></i>
                保存灵感
            </button>
            <div class="grid grid-cols-2 gap-4">
                <button class="glassmorphism rounded-2xl py-3 px-4 text-purple-300 font-medium">
                    <i class="fas fa-cogs mr-2"></i>
                    立即开发
                </button>
                <button class="glassmorphism rounded-2xl py-3 px-4 text-green-300 font-medium">
                    <i class="fas fa-share mr-2"></i>
                    分享讨论
                </button>
            </div>
        </div>
    </div>

    <!-- 浮动操作按钮 -->
    <div class="fixed bottom-6 right-6">
        <button class="w-14 h-14 bg-gradient-to-r from-green-500 to-blue-500 rounded-full flex items-center justify-center floating-button shadow-lg">
            <i class="fas fa-magic text-white text-xl"></i>
        </button>
    </div>
</body>
</html>
